<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 366" width="486" height="366" role="img" aria-label="The same three dashes measured in each editor face; the monospace face draws all three the same width and the proportional faces do not">
<style>
:root{--fig-ink:#15151C;--fig-paper:#FAF8F3;--fig-rule:#E4DFD5;
--fig-label:#6A6A77;--fig-wash:#C98A2E}
@media (prefers-color-scheme: dark){:root{
--fig-ink:#F2F0EA;--fig-paper:#141415;--fig-rule:#242425;
--fig-label:#8C8C89;--fig-wash:#D3A648}}
.l{font:600 11px ui-sans-serif,system-ui,sans-serif;
fill:var(--ink-3,var(--fig-label));letter-spacing:.06em}
.n{font:11px ui-monospace,monospace;fill:var(--ink-3,var(--fig-label))}
.h{font:600 10px ui-sans-serif,system-ui,sans-serif;
fill:var(--ink,var(--fig-ink));letter-spacing:.1em}
.paper{fill:var(--surface,var(--fig-paper))}
.ink{fill:var(--ink,var(--fig-ink))}
.wash{fill:var(--warn,var(--fig-wash))}
.rule{stroke:var(--rule,var(--fig-rule))}
.rulef{fill:var(--rule,var(--fig-rule))}
</style>
<rect width="486" height="366" class="paper"/>
<text class="h" x="16" y="34">MONO · MENLO 13px — ALL THE SAME WIDTH</text>
<text class="l" x="16" y="74">hyphen</text>
<text class="n" x="108" y="74">U+002D</text>
<rect x="176" y="65" width="80" height="7" class="wash"/>
<text class="n" x="350" y="74">8 px</text>
<text class="l" x="16" y="100">en dash</text>
<text class="n" x="108" y="100">U+2013</text>
<rect x="176" y="91" width="80" height="7" class="wash"/>
<text class="n" x="350" y="100">8 px</text>
<text class="l" x="16" y="126">em dash</text>
<text class="n" x="108" y="126">U+2014</text>
<rect x="176" y="117" width="80" height="7" class="wash"/>
<text class="n" x="350" y="126">8 px</text>
<line x1="16" y1="132" x2="470" y2="132" class="rule"/>
<text class="h" x="16" y="146">SANS · SFNS 14px — THREE WIDTHS</text>
<text class="l" x="16" y="186">hyphen</text>
<text class="n" x="108" y="186">U+002D</text>
<rect x="176" y="177" width="60" height="7" class="ink"/>
<text class="n" x="350" y="186">6 px</text>
<text class="l" x="16" y="212">en dash</text>
<text class="n" x="108" y="212">U+2013</text>
<rect x="176" y="203" width="90" height="7" class="ink"/>
<text class="n" x="350" y="212">9 px</text>
<text class="l" x="16" y="238">em dash</text>
<text class="n" x="108" y="238">U+2014</text>
<rect x="176" y="229" width="130" height="7" class="ink"/>
<text class="n" x="350" y="238">13 px</text>
<line x1="16" y1="244" x2="470" y2="244" class="rule"/>
<text class="h" x="16" y="258">SERIF · IOWAN OLD STYLE 15px — THREE WIDTHS</text>
<text class="l" x="16" y="298">hyphen</text>
<text class="n" x="108" y="298">U+002D</text>
<rect x="176" y="289" width="50" height="7" class="ink"/>
<text class="n" x="350" y="298">5 px</text>
<text class="l" x="16" y="324">en dash</text>
<text class="n" x="108" y="324">U+2013</text>
<rect x="176" y="315" width="80" height="7" class="ink"/>
<text class="n" x="350" y="324">8 px</text>
<text class="l" x="16" y="350">em dash</text>
<text class="n" x="108" y="350">U+2014</text>
<rect x="176" y="341" width="150" height="7" class="ink"/>
<text class="n" x="350" y="350">15 px</text>
<line x1="16" y1="356" x2="470" y2="356" class="rule"/>
</svg>