<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 486 366" width="486" height="366" role="img" aria-label="The same three dashes measured in each editor face; the monospace face draws all three the same width and the proportional faces do not">
<style>.l{font:600 11px ui-sans-serif,system-ui,sans-serif;fill:#6A6A77}.n{font:11px ui-monospace,monospace;fill:#6A6A77}.h{font:600 10px ui-sans-serif,system-ui,sans-serif;fill:#15151C;letter-spacing:.1em}</style>
<rect width="486" height="366" fill="#FAF8F3"/>
