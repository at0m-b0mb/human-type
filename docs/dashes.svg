<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 342" width="520" height="342" role="img" aria-label="8 dash characters rendered at 13px; 6 of them are the same stroke, pixel for pixel">
<style>
:root{--fig-ink:#15151C;--fig-paper:#FAF8F3;--fig-rule:#E4DFD5;
--fig-label:#6A6A77;--fig-wash:#C98A2E}
@media (prefers-color-scheme: dark){:root{
--fig-ink:#F2F0EA;--fig-paper:#141415;--fig-rule:#242425;
--fig-label:#8C8C89;--fig-wash:#D3A648}}
.l{font:600 11px ui-sans-serif,system-ui,sans-serif;
fill:var(--ink-3,var(--fig-label));letter-spacing:.06em}
.n{font:11px ui-monospace,monospace;fill:var(--ink-3,var(--fig-label))}
.h{font:600 10px ui-sans-serif,system-ui,sans-serif;
fill:var(--ink,var(--fig-ink));letter-spacing:.1em}
.paper{fill:var(--surface,var(--fig-paper))}
.ink{fill:var(--ink,var(--fig-ink))}
.wash{fill:var(--warn,var(--fig-wash))}
.rule{stroke:var(--rule,var(--fig-rule))}
.rulef{fill:var(--rule,var(--fig-rule))}
</style>
<rect width="520" height="342" class="paper"/>
<text class="h" x="16" y="22">CHARACTER</text>
<text class="h" x="288" y="22">INK, 8× ACTUAL</text>
<text class="h" x="408" y="22">MEASURED</text>
<line x1="16" y1="32" x2="504" y2="32" class="rule"/>
<text class="l" x="16" y="58">HYPHEN-MINUS</text>
<text class="n" x="200" y="58">U+002D</text>
<rect x="288" y="38" width="64" height="24" fill="none" class="rule" stroke-dasharray="2 3"/>
<rect x="288" y="46" width="64" height="8" class="ink"/>
<text class="n" x="408" y="58">8 × 1 px</text>
<text class="l" x="16" y="92">HYPHEN</text>
<text class="n" x="200" y="92">U+2010</text>
<rect x="288" y="72" width="64" height="24" fill="none" class="rule" stroke-dasharray="2 3"/>
<rect x="304" y="80" width="32" height="8" class="ink"/>
<text class="n" x="408" y="92">4 × 1 px</text>
<line x1="16" y1="63" x2="504" y2="63" class="rule" stroke-opacity=".6"/>
<text class="l" x="16" y="126">NON-BREAKING HYPHEN</text>
<text class="n" x="200" y="126">U+2011</text>
<rect x="288" y="106" width="64" height="24" fill="none" class="rule" stroke-dasharray="2 3"/>
<rect x="304" y="114" width="32" height="8" class="ink"/>
<text class="n" x="408" y="126">4 × 1 px</text>
<line x1="16" y1="97" x2="504" y2="97" class="rule" stroke-opacity=".6"/>
<text class="l" x="16" y="160">FIGURE DASH</text>
<text class="n" x="200" y="160">U+2012</text>
<rect x="288" y="140" width="64" height="24" fill="none" class="rule" stroke-dasharray="2 3"/>
<rect x="288" y="148" width="64" height="8" class="ink"/>
<text class="n" x="408" y="160">8 × 1 px</text>
<line x1="16" y1="131" x2="504" y2="131" class="rule" stroke-opacity=".6"/>
<text class="l" x="16" y="194">EN DASH</text>
<text class="n" x="200" y="194">U+2013</text>
<rect x="288" y="174" width="64" height="24" fill="none" class="rule" stroke-dasharray="2 3"/>
<rect x="288" y="182" width="64" height="8" class="ink"/>
<text class="n" x="408" y="194">8 × 1 px</text>
<line x1="16" y1="165" x2="504" y2="165" class="rule" stroke-opacity=".6"/>
<text class="l" x="16" y="228">EM DASH</text>
<text class="n" x="200" y="228">U+2014</text>
<rect x="288" y="208" width="64" height="24" fill="none" class="rule" stroke-dasharray="2 3"/>
<rect x="288" y="216" width="64" height="8" class="ink"/>
<text class="n" x="408" y="228">8 × 1 px</text>
<line x1="16" y1="199" x2="504" y2="199" class="rule" stroke-opacity=".6"/>
<text class="l" x="16" y="262">HORIZONTAL BAR</text>
<text class="n" x="200" y="262">U+2015</text>
<rect x="288" y="242" width="64" height="24" fill="none" class="rule" stroke-dasharray="2 3"/>
<rect x="288" y="250" width="64" height="8" class="ink"/>
<text class="n" x="408" y="262">8 × 1 px</text>
<line x1="16" y1="233" x2="504" y2="233" class="rule" stroke-opacity=".6"/>
<text class="l" x="16" y="296">MINUS SIGN</text>
<text class="n" x="200" y="296">U+2212</text>
<rect x="288" y="276" width="64" height="24" fill="none" class="rule" stroke-dasharray="2 3"/>
<rect x="288" y="284" width="64" height="8" class="ink"/>
<text class="n" x="408" y="296">8 × 1 px</text>
<line x1="16" y1="267" x2="504" y2="267" class="rule" stroke-opacity=".6"/>
<rect x="16" y="316" width="488" height="1" class="rulef"/>
<text class="n" x="16" y="332">Menlo at 13px, the editor’s own size — 6 of these 8 are the same pixels.</text>
</svg>